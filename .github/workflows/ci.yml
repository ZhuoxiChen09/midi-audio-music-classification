name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 torchaudio==2.11.1 torchvision==0.29.2
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: pytest -q
      - run: python -c 'import pipeline, baseline'
      - run: ruff check .
